<!DOCTYPE html>

<html lang="en" >

    <head>

        <meta charset="UTF-8">

        <title>Mehmet Baykal Personal Blog</title>

        <meta name="viewport" content="width=device-width, initial-scale=1">

        <style>
        * { box-sizing: border-box; }

        /* force scrollbar */
        html { overflow-y: scroll; }

        body { font-family: sans-serif; }

        a { text-decoration: none; color: black; }

        /* ---- grid ---- */

        .grid {

        }

        /* clear fix */
        .grid:after {
          content: '';
          display: block;
          clear: both;
        }

        /* ---- .grid-item ---- */

        @media only screen and (max-width: 600px) {
            .grid-sizer,
            .grid-item {
              width: 100%;
            }
        }

        @media only screen and (max-width: 1200px) and (min-width: 900px) {
            .grid-sizer,
            .grid-item {
              width: 50%;
            }
        }

        @media only screen and (min-width: 1200px) {
            .grid-sizer,
            .grid-item {
              width: 33.33333%;
            }
        }


        .grid-item {
          float: left;
        }

        .filter.active { font-weight: bold; text-decoration: underline; }

        .tag {
          display: inline-block;
          font-size: 12px;
          padding: 1px 6px;
          border: 1px solid black;
          margin-bottom: 6px;
        }

        /* 600-900px arası: 2 kolon (önceden bu aralıkta kural yoktu) */
        @media only screen and (min-width: 600px) and (max-width: 900px) {
            .grid-sizer,
            .grid-item {
              width: 50%;
            }
        }

        /* ---- Tema: Gazete ---- */
        body { background:#fbfaf6; color:#111; font-family: Georgia, "Times New Roman", serif; margin:0; }
        body a { color:#111; }

        /* Header: ortalı başlık, altında çift çizgi */
        body > div:first-of-type { border:none !important; border-bottom:4px double #111 !important; margin:0 16px; padding:18px 0 4px; }
        body > div:first-of-type > div { float:none !important; width:100% !important; text-align:center; }
        body > div:first-of-type p { text-align:center !important; padding:0 !important; }
        h1 { font-size:3.2rem; font-weight:900; margin:4px 0; letter-spacing:-1px; }

        /* Menü */
        .filter { font-family:-apple-system, "Segoe UI", sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase; margin:0 10px; }
        .filter.active { text-decoration:none; border-bottom:2px solid #111; font-weight:700; }
        .fa { font-size:16px !important; margin:0 6px; }

        /* Kartlar */
        .grid-item > div { margin:12px !important; padding:10px 4px 0 !important; border:none !important; border-top:3px solid #111 !important; }
        h4 { font-size:1.4rem; font-weight:900; text-transform:uppercase; letter-spacing:-.3px; margin:4px 0; line-height:1.15; }
        .tag { border:none; padding:0; font-family:-apple-system, sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#666; }
        .content { text-align:justify; hyphens:auto; line-height:1.55; font-size:15px; }

        /* İlk harf büyük (drop cap) */
        .content::first-letter { float:left; font-size:3.2em; line-height:.85; padding:4px 6px 0 0; font-weight:900; }
        </style>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    </head>

    <body translate="no">

        <div style="width: 100%;overflow:auto;border: 2px solid black;">

            <div style="float:left; width: 60%">

                <h1>Mehmet Baykal</h1>

            </div>

            <div style="float:right; width: 40%;">

                <p style="text-align:right; padding-right:10px;">
                    <a href="#all" class="filter" data-filter="all">all</a>  
                    <a href="#felsefe" class="filter" data-filter="felsefe">felsefe</a>  
                    <a href="#sanat" class="filter" data-filter="sanat">sanat</a>  
                    <a href="#kitap" class="filter" data-filter="kitap">kitap</a>  
                    <a href="#seyahat" class="filter" data-filter="seyahat">seyahat</a>  
                </p>

                <p style="text-align:right; padding-right:10px;">
                    <a href="https://x.com/baykalmehmet"><i class="fa fa-twitter" style="font-size:24px"></i></a>
                    <a href="https://www.instagram.com/mehmet_baykal"><i class="fa fa-instagram" style="font-size:24px"></i></a>
                    <a href="https://www.linkedin.com/in/mehmetbaykal"><i class="fa fa-linkedin" style="font-size:24px"></i></a>
                </p>

            </div>

        </div>

<p id="empty-msg" style="display:none; padding:10px;">Bu kategoride makale yok.</p>

<div class="grid">

    <div class="grid-sizer"></div>

</div>

<script src='https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.js'></script>

<script>

    var grid = document.querySelector('.grid');
    var links = document.querySelectorAll('.filter');
    var emptyMsg = document.getElementById('empty-msg');
    var allItems = [];
    var msnry = null;

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Bir makale nesnesinden kart oluşturur.
    // content alanı HTML kabul eder (<br>, <p>, <pre>, <ul> vb.)
    function createCard(article) {
      var item = document.createElement('div');
      item.className = 'grid-item';
      item.setAttribute('data-category', article.category);

      var html = '<div style="margin:3px;padding:3px;border-bottom:2px solid black;">' +
        '<h4>' + escapeHtml(article.title) + '</h4>' +
        '<span class="tag">' + escapeHtml(article.category) + '</span>' +
        '<div class="content">' + article.content + '</div>';

      if (article.readMore) {
        html += '<p><a href="' + encodeURI(article.readMore) + '"> Keep Reading </a></p>';
      }

      item.innerHTML = html + '</div>';
      return item;
    }

    function applyFilter(category) {
      var visible = 0;

      allItems.forEach(function (item) {
        if (item.parentNode) grid.removeChild(item);
      });
      allItems.forEach(function (item) {
        if (category === 'all' || item.getAttribute('data-category') === category) {
          grid.appendChild(item);
          visible++;
        }
      });

      emptyMsg.style.display = visible === 0 ? 'block' : 'none';

      for (var i = 0; i < links.length; i++) {
        links[i].classList.toggle('active', links[i].getAttribute('data-filter') === category);
      }

      if (msnry) {
        msnry.reloadItems();
        msnry.layout();
      }
    }

    function filterFromHash() {
      var cat = window.location.hash.replace('#', '') || 'all';
      var known = Array.prototype.some.call(links, function (l) {
        return l.getAttribute('data-filter') === cat;
      });
      applyFilter(known ? cat : 'all');
    }

    for (var i = 0; i < links.length; i++) {
      links[i].addEventListener('click', function (e) {
        e.preventDefault();
        var cat = this.getAttribute('data-filter');
        history.replaceState(null, '', '#' + cat);
        applyFilter(cat);
      });
    }

    window.addEventListener('hashchange', filterFromHash);

    fetch('articles.json', { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (articles) {
        allItems = articles.map(createCard);

        if (typeof Masonry !== 'undefined') {
          msnry = new Masonry(grid, {
            itemSelector: '.grid-item',
            columnWidth: '.grid-sizer',
            percentPosition: true
          });
        }

        filterFromHash();
      })
      .catch(function (err) {
        emptyMsg.textContent = 'Makaleler yüklenemedi (' + err.message + ').';
        emptyMsg.style.display = 'block';
      });

</script>

    </body>

</html>
